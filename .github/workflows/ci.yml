name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
      # Keep anyhow CLI refusal text stable while retaining test panic backtraces.
      RUST_LIB_BACKTRACE: 0
      # Loose-store tests require a qualified local filesystem (not /tmp tmpfs).
      RGIT_TEST_APP_ROOT: ${{ github.workspace }}/target/test-repositories
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy
      - name: Prepare test filesystem
        shell: bash
        run: mkdir -p "$RGIT_TEST_APP_ROOT"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Workspace tests
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace --locked 2>&1 | tee test-results.log
      - name: Check library source isolation
        run: python3 scripts/check-library-isolation.py
      - name: Preserve test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ matrix.os }}
          path: test-results.log
          if-no-files-found: ignore

  msrv:
    name: Minimum Rust 1.85
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable action
        with:
          toolchain: 1.85.0
      - run: cargo check --workspace --all-targets --locked

  dependencies:
    name: Dependency policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - run: cargo install cargo-deny --version 0.20.2 --locked
      - run: cargo deny --locked check
